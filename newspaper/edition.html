<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Edition — DSE Newspaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="newspaper.css" />
<link rel="stylesheet" href="edition.css" />
<script src="/shared/display-settings.js"></script>
<script src="/shared/session-guard.js"></script>
<link rel="stylesheet" href="/shared/mobile.css" />
<meta name="robots" content="noindex, nofollow" />
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo-block">
      <span class="logo-tag">DSE</span>
      <div class="logo-text">
        <h1>Live Market</h1>
        <p>Dhaka Stock Exchange — All Listed Securities</p>
      </div>
    </div>
    <div class="header-meta">
      <a href="../index.html" class="wl-toggle-btn" style="text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Home
      </a>
      <button class="theme-toggle" id="theme-toggle-btn" title="Toggle light/dark mode">
        <span class="toggle-icon" id="theme-icon">☀️</span>
        <span id="theme-label">Light</span>
      </button>
    </div>
  </div>
</header>

<div class="np-shell ed-shell">
  <div class="ed-actions">
    <a href="newspaper.html" class="np-back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to the newsroom
    </a>
    <div class="ed-actions-right">
      <button type="button" id="ed-copy-btn" class="np-today-btn">Copy link</button>
      <button type="button" id="ed-print-btn" class="np-scan-btn">Print / Save as PDF</button>
    </div>
  </div>

  <div id="ed-status" class="np-status">Loading your edition…</div>

  <!-- The whole printable front page is rendered into here -->
  <article id="ed-paper" class="ed-paper" style="display:none;"></article>
</div>

<footer class="site-footer">
  <p>For informational purposes only · Not financial advice</p>
</footer>

<script src="edition.js" defer></script>
<script type="module">
  // Shared theme module — the one `dse-theme` key and [data-theme] contract
  // every page uses. This page used to carry its own inline copy keyed on
  // `theme-preference`, so a theme chosen elsewhere reset when you arrived.
  import { initTheme, toggleTheme } from '/theme/theme.js';
  initTheme();
  document.getElementById('theme-toggle-btn').addEventListener('click', () => toggleTheme());
</script>
  <script src="/shared/nav-menu.js"></script>
</body>
</html>

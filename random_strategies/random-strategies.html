<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Random Strategies — DSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="random-strategies.css" />
<script src="/shared/display-settings.js"></script>
<script src="/shared/session-guard.js"></script>
<link rel="stylesheet" href="/shared/mobile.css" />
<meta name="robots" content="noindex, nofollow" />
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo-block">
      <a href="../index.html" class="logo-back" title="Back to Market">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </a>
      <span class="logo-tag">DSE</span>
      <div class="logo-text">
        <h1>Random Strategies</h1>
        <p>A grab-bag of one-off screens and scorers</p>
      </div>
    </div>
    <div class="header-meta">
      <button class="theme-toggle has-tooltip" id="theme-toggle-btn" data-tooltip="Toggle light/dark mode" aria-label="Toggle light/dark mode">
        <span class="toggle-icon" id="theme-icon">☀️</span>
        <span id="theme-label">Light</span>
      </button>
    </div>
  </div>
</header>

<main class="rs-main">
  <div class="rs-grid" id="rs-grid"></div>
</main>

<script>
  // Each strategy lives on its own page under this folder. Add a new
  // entry here when a new one ships — the grid renders itself from this.
  const STRATEGIES = [
    {
      href: 'mcda-scorer.html',
      title: 'MCDA Dividend Scorer',
      desc: 'Ranks dividend-paying stocks across five weighted criteria — yield, dividend growth, ROE, revenue growth, and earnings quality — min-max normalized to a 0-100 score. Editable worksheet, seeded with a sample list.',
      icon: '<path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-7"/>',
    },
    {
      href: 'mcda-banks.html',
      title: 'Bank Dividend Ranking',
      desc: 'Same MCDA scoring, but for all 31 comparable DSE banks with real computed inputs — yield, dividend growth, ROE, asset growth, and asset quality — sourced from this site’s own bank_financials data.',
      icon: '<rect x="3" y="10" width="18" height="10" rx="1"/><path d="M5 10V6l7-4 7 4v4"/><line x1="3" y1="22" x2="21" y2="22"/>',
    },
  ];

  const grid = document.getElementById('rs-grid');
  grid.innerHTML = STRATEGIES.map((s) => `
    <a class="rs-card" href="${s.href}">
      <span class="rs-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg></span>
      <span class="rs-card-title">${s.title}</span>
      <span class="rs-card-desc">${s.desc}</span>
      <span class="rs-card-open">Open →</span>
    </a>`).join('') + `
    <div class="rs-card rs-card-placeholder">
      <span class="rs-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="rs-card-title">More coming soon</span>
      <span class="rs-card-desc">This page will pick up more one-off strategies over time.</span>
    </div>`;
</script>

<script type="module">
  import { initTheme, toggleTheme } from '/theme/theme.js';
  initTheme();
  document.getElementById('theme-toggle-btn').addEventListener('click', () => toggleTheme());
</script>
<script src="/shared/nav-menu.js"></script>
</body>
</html>
